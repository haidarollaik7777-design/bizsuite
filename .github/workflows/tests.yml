name: Django tests

on:
  push:
    branches: [stable-reports, chore/*, feat/*]
  pull_request:
    branches: [stable-reports]

jobs:
  test:
    runs-on: windows-latest
    env:
      DJANGO_SETTINGS_MODULE: bizsuite.settings
      PYTHONHASHSEED: '0'
      TZ: Asia/Beirut
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python - << 'PY'
          import sys, os, platform
          print("Python:", sys.version)
          print("Exe:", sys.executable)
          print("CWD:", os.getcwd())
          print("sys.path:", sys.path)
          PY

      - name: Run smoke tests (admin reports)
        run: |
          python manage.py test reports.tests.test_admin_reports -v 3
