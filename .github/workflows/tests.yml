name: Django tests
on:
  push:
    branches: [ stable-reports, chore/** ]
  pull_request:
    branches: [ stable-reports ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: bizsuite.settings
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Python/Django and settings
        run: |
          python - <<'PY'
          import sys, os, json
          print("Python:", sys.version)
          print("CWD:", os.getcwd())
          import django
          django.setup()
          from django.conf import settings
          print("Django:", django.get_version())
          print("DB ENGINE:", settings.DATABASES["default"]["ENGINE"])
          print("INSTALLED_APPS count:", len(settings.INSTALLED_APPS))
          PY

      - name: Django check
        run: python manage.py check -v 2

      - name: Run reports tests (smoke)
        run: python manage.py test reports.tests -v 2 --failfast

      - name: Run full test suite
        run: python manage.py test -v 2 --failfast

