name: Django tests

on:
  push:
    branches:
      - stable-reports
      - chore/**
  pull_request:
    branches:
      - stable-reports

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Python/Django
        env:
          DJANGO_SETTINGS_MODULE: bizsuite.settings
        run: |
          python - <<'PY'
          import sys, os, django
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','bizsuite.settings')
          django.setup()
          from django.conf import settings
          print("Python:", sys.version)
          print("Django:", django.get_version())
          print("DB ENGINE:", settings.DATABASES['default']['ENGINE'])
          PY

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: bizsuite.settings
          PYTHONUNBUFFERED: "1"
          TZ: UTC
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
        run: |
          python manage.py test -v 2 --failfast
