name: Django tests
on:
  push:
    branches: [ stable-reports, chore/** ]
  pull_request:
    branches: [ stable-reports ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: bizsuite.settings
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django check
        run: python manage.py check -v 2
      - name:       - name: Run Django tests (full)
        run: |
          python manage.py test -v 2 --failfast

