name: Django tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: PYTHON_VERSION
          cache: "pip"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test -v 2
