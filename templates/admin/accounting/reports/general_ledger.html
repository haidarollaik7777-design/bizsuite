{% extends "admin/base_site.html" %}
{% block content %}
<h1>General Ledger</h1>

<form method="get" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin:12px 0;">
  <div><label>From</label><input type="date" name="from" value="{{ dfrom|date:'Y-m-d' }}"></div>
  <div><label>To</label><input type="date" name="to" value="{{ dto|date:'Y-m-d' }}"></div>
  <div><label>Account code (prefix)</label><input type="text" name="code_prefix" placeholder="e.g. 1200" value="{{ code_prefix }}"></div>
  <div style="display:flex; gap:8px;">
    <button type="submit">Apply</button>
    <a class="button" href="{{ request.path }}">Clear</a>
    <a class="button" href="?from={{ dfrom|date:'Y-m-d' }}&to={{ dto|date:'Y-m-d' }}{% if code_prefix %}&code_prefix={{ code_prefix }}{% endif %}&format=csv">Export CSV</a>
    <a class="button" href="?from={{ dfrom|date:'Y-m-d' }}&to={{ dto|date:'Y-m-d' }}{% if code_prefix %}&code_prefix={{ code_prefix }}{% endif %}&format=xlsx">Export XLSX</a>
  </div>
</form>

<table style="width:100%; border-collapse:collapse;">
  <thead><tr>
    <th style="text-align:left; padding:6px;">Date</th>
    <th style="text-align:left; padding:6px;">Code</th>
    <th style="text-align:left; padding:6px;">Name</th>
    <th style="text-align:right; padding:6px;">Debit</th>
    <th style="text-align:right; padding:6px;">Credit</th>
    <th style="text-align:left; padding:6px;">Memo</th>
  </tr></thead>
  <tbody>
    {% for d,c,n,deb,cre,memo in rows %}
      <tr>
        <td style="padding:6px;">{{ d }}</td>
        <td style="padding:6px;">{{ c }}</td>
        <td style="padding:6px;">{{ n }}</td>
        <td style="text-align:right; padding:6px;">{{ deb }}</td>
        <td style="text-align:right; padding:6px;">{{ cre }}</td>
        <td style="padding:6px;">{{ memo }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="6" style="padding:6px;">No rows found.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
